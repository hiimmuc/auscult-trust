# RQ3 / H4: conformal coverage under the official-split shift, with and without Tent. Plain FM (G1). Paths relative to repo root.
icbhi_root: ../data/raw/icbhi/ICBHI_final_database
cache_root: ../data/cache
split_file: ../data/splits/icbhi_official_v1.json
encoder: clap_htsat
use_branch: false
use_phase: false
lr: 0.001
wd: 0.01
epochs: 50
bs: 64
alpha: 0.1
k_patients: 10        # labelled official-test patients for V5 k-shot; the other 39 are the evaluation set
tent_lrs: [0.001, 0.01]  # dose-response, not tuned; Tent updates LayerNorm affine params only
tent_epochs: 1
seeds: [0, 1, 2, 3, 4]
