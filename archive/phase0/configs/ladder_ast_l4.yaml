# R3 retry: AST fine-tuned from the layer-4 token cache, lr_block 5e-5, 30 epochs, +mix.
icbhi_root: ../data/raw/icbhi/ICBHI_final_database
split_file: ../data/splits/icbhi_official_v1.json
cache_dir: ../data/cache/ast_audioset_l4_feat   # from: python -m src.features configs/extract_ast_l4.yaml
exp: ladder_ast_l4
cv_folds: 5
ft_cv_folds: 3                        # folds used for fine-tuning cells (cost); head cells use all cv_folds
head_grid:
  layer_mode: [last, concat, scalar]
  pool: [mean, max, meanmax, attn]
head: {hidden: 128, lr_head: 1.0e-3, wd: 0.01, bs: 64, epochs: 30}
ft_ks: [4, 8]                         # number of fine-tuned last blocks (token cache after block 4)
lora_ranks: []
class_weight: none                    # `balanced`: loss weighted by inverse class frequency (use a new exp name)
ft_pool: attn                         # overridden by --pool; pick the best pool from the cv-head table
ft: {lr_head: 1.0e-3, lr_block: 5.0e-5, lr_lora: 2.0e-4, wd: 0.01, bs: 16, epochs: 30,
    mix: {alpha: 1.0, con_weight: 1.0, temp: 0.06}, ema_beta: 0.5}  # recipe flags +mix, +ema (src/auscult_trust/augment.py)
seeds: [0, 1, 2, 3, 4]
